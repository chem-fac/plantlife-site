    <style>
        .all-ep-main {
            padding-top: calc(var(--header-h) + 40px);
            padding-bottom: 80px;
            min-height: 80vh;
        }

        .all-ep-count {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--light-muted);
            margin-bottom: 24px;
        }

        /* Search */
        .ep-search-wrap {
            margin-bottom: 32px;
        }

        .ep-search {
            width: 100%;
            max-width: 480px;
            padding: 12px 20px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--light-border);
            font-size: 0.9rem;
            font-family: var(--font-body);
            background: var(--light-surface);
            color: var(--light-text);
            transition: border-color 0.3s;
        }

        .ep-search:focus {
            outline: none;
            border-color: var(--brand);
        }

        /* Tag filter bar */
        .ep-filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .ep-filter-chip {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--light-secondary);
            background: var(--light-surface);
            border: 1px solid var(--light-border);
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: all 0.2s var(--ease);
            line-height: 1.4;
        }

        .ep-filter-chip:hover {
            border-color: var(--brand);
            color: var(--brand);
        }

        .ep-filter-chip.active {
            background: var(--brand);
            border-color: var(--brand);
            color: #fff;
        }

        .ep-filter-chip .ep-filter-count {
            opacity: 0.6;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            margin-left: 4px;
        }

        /* Card tags */
        .all-ep-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }

        .all-ep-tag {
            font-size: 0.66rem;
            font-weight: 500;
            color: var(--brand);
            background: var(--brand-50);
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: background 0.2s var(--ease);
        }

        .all-ep-tag:hover {
            background: var(--brand);
            color: #fff;
        }

        /* Grid */
        .all-ep-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .all-ep-card {
            display: flex;
            flex-direction: column;
            background: var(--light-surface);
            border: 1px solid var(--light-border);
            overflow: hidden;
            transition: all 0.3s var(--ease);
        }

        .all-ep-card:hover {
            border-color: var(--brand);
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .all-ep-thumb {
            width: 100%;
            aspect-ratio: 1;
            overflow: hidden;
            flex-shrink: 0;
        }

        .all-ep-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .all-ep-body {
            padding: 12px 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .all-ep-num {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--brand);
        }

        .all-ep-title {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--light-text);
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .all-ep-date {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--light-muted);
        }

        .ep-no-results {
            text-align: center;
            padding: 48px 0;
            color: var(--light-muted);
            font-size: 0.9rem;
            display: none;
        }

        @media (max-width: 1024px) {
            .all-ep-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .all-ep-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('all-ep-grid');
            const search = document.getElementById('ep-search');
            const countEl = document.getElementById('ep-count');
            const noResults = document.getElementById('ep-no-results');
            const filterBar = document.getElementById('ep-filter-bar');
            let allEpisodes = [];
            let activeTag = '';

            // フィルタバーでのタグ表示順（統制語彙）。これ以外のタグは末尾に追加。
            const TAG_ORDER = [
                '化学物質・材料', '化学反応', 'プラント設備・装置', 'プロセス・運転管理',
                '安全・トラブル', '環境・資源循環', '化学工学', '計測・制御・DX',
                '仕事・キャリア', '業界・ビジネス', '科学・雑学', '番組・コラボ企画'
            ];

            // Mobile menu
            const btn = document.getElementById('mobile-menu-btn');
            const nav = document.getElementById('header-nav');
            if (btn && nav) {
                btn.addEventListener('click', () => {
                    btn.classList.toggle('open');
                    nav.classList.toggle('open');
                });
            }

            // URLパラメータ（?tag= / ?q=）で初期状態を復元
            const params = new URLSearchParams(location.search);
            activeTag = params.get('tag') || '';
            if (params.get('q')) search.value = params.get('q');

            fetch('../episodes.json')
                .then(r => r.json())
                .then(data => {
                    allEpisodes = data
                        .filter(ep => ep.number && parseInt(ep.number) > 0)
                        .sort((a, b) => parseInt(b.number) - parseInt(a.number));
                    buildFilterBar();
                    applyFilters();
                });

            // タグの一覧（出現回数つき）を作り、フィルタバーを描画
            function buildFilterBar() {
                const counts = {};
                allEpisodes.forEach(ep => (ep.tags || []).forEach(t => {
                    counts[t] = (counts[t] || 0) + 1;
                }));
                const tags = Object.keys(counts).sort((a, b) => {
                    const ia = TAG_ORDER.indexOf(a), ib = TAG_ORDER.indexOf(b);
                    if (ia !== -1 && ib !== -1) return ia - ib;
                    if (ia !== -1) return -1;
                    if (ib !== -1) return 1;
                    return a.localeCompare(b, 'ja');
                });

                filterBar.innerHTML = '';
                if (!tags.length) return;

                filterBar.appendChild(makeChip('すべて', '', allEpisodes.length));
                tags.forEach(t => filterBar.appendChild(makeChip(t, t, counts[t])));
            }

            function makeChip(label, tagValue, count) {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.dataset.tag = tagValue;
                chip.className = 'ep-filter-chip' + (tagValue === activeTag ? ' active' : '');
                chip.innerHTML = `${escapeHtml(label)}<span class="ep-filter-count">${count}</span>`;
                chip.addEventListener('click', () => {
                    activeTag = (activeTag === tagValue) ? '' : tagValue;
                    updateChipStates();
                    applyFilters();
                });
                return chip;
            }

            function updateChipStates() {
                filterBar.querySelectorAll('.ep-filter-chip').forEach(chip => {
                    chip.classList.toggle('active', chip.dataset.tag === activeTag);
                });
            }

            function applyFilters() {
                const q = search.value.toLowerCase().trim();
                const filtered = allEpisodes.filter(ep => {
                    if (activeTag && !(ep.tags || []).includes(activeTag)) return false;
                    if (!q) return true;
                    const haystack = [
                        ep.title,
                        ep.description || '',
                        ep.number,
                        (ep.tags || []).join(' '),
                        (ep.keywords || []).join(' ')
                    ].join(' ').toLowerCase();
                    return haystack.includes(q);
                });
                renderEpisodes(filtered);
                syncUrl(q);
            }

            function syncUrl(q) {
                const p = new URLSearchParams();
                if (activeTag) p.set('tag', activeTag);
                if (q) p.set('q', q);
                const qs = p.toString();
                history.replaceState(null, '', qs ? `?${qs}` : location.pathname);
            }

            function renderEpisodes(episodes) {
                grid.innerHTML = '';
                let label = `${episodes.length}件のエピソード`;
                if (activeTag) label += ` ・ タグ「${activeTag}」`;
                countEl.textContent = label;
                noResults.style.display = episodes.length === 0 ? 'block' : 'none';

                episodes.forEach(ep => {
                    let title = ep.title;
                    const m = title.match(/^#?\d+\s+(.+)/);
                    if (m) title = m[1];

                    const tagsHtml = (ep.tags || []).map(t =>
                        `<span class="all-ep-tag" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</span>`
                    ).join('');

                    const card = document.createElement('a');
                    card.href = `${ep.number}/`;
                    card.className = 'all-ep-card';
                    card.innerHTML = `
            <div class="all-ep-thumb">
              <img src="${escapeHtml(ep.thumbnail || '../images/podcast-artwork.png')}" alt="${escapeHtml(title)}" loading="lazy">
            </div>
            <div class="all-ep-body">
              <span class="all-ep-num">#${ep.number}</span>
              <h3 class="all-ep-title">${escapeHtml(title)}</h3>
              <span class="all-ep-date">${ep.pub_date || ''}</span>
              ${tagsHtml ? `<div class="all-ep-tags">${tagsHtml}</div>` : ''}
            </div>
          `;
                    grid.appendChild(card);
                });
            }

            // カード内タグのクリックはエピソード遷移させず、その場で絞り込む
            grid.addEventListener('click', e => {
                const tagEl = e.target.closest('.all-ep-tag');
                if (!tagEl) return;
                e.preventDefault();
                e.stopPropagation();
                activeTag = tagEl.dataset.tag;
                search.value = '';
                updateChipStates();
                applyFilters();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            let searchTimer;
            search.addEventListener('input', () => {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(applyFilters, 120);
            });

            function escapeHtml(str) {
                const d = document.createElement('div');
                d.textContent = String(str);
                return d.innerHTML;
            }
        });
    </script>
